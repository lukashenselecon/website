name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the pages
        run: python3 build.py

      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to the server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'build.py' --exclude 'data.py' \
            --exclude '__pycache__' --exclude 'README.md' \
            --exclude 'deploy' --exclude 'START-HERE.md' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ root@${{ secrets.SERVER_IP }}:/var/www/lukashensel.com/

      - name: Fix ownership
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.SERVER_IP }} \
            'chown -R www-data:www-data /var/www/lukashensel.com'
